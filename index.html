  default: null,
  aeci: r => [Math.exp(FITS.aeciP50.a + FITS.aeciP50.b * r.aeci),

// ── Trend fits ──
const DAY_MS = 86400000;
const mo2a = months => Math.LN2 / (months * 30.44 * DAY_MS); // doubling-months → log-slope per ms
const a2mo = a => Math.LN2 / a / (30.44 * DAY_MS);           // log-slope per ms → doubling-months

// Fixed-slope fit: force doubling time, optimize intercept only (b = mean(log y − a·x)).
function fitFixed(pts, doublingMonths) {
  const a = mo2a(doublingMonths);
  let sum = 0;
  for (const {x,y} of pts) sum += Math.log(y) - a * x;
  const b = sum / pts.length;
  return { a, b, pred: x => Math.exp(a*x+b), dMo: doublingMonths, fitted: false };
}

// Ordinary least-squares fit on (x = ms, y = log hours): slope responds to the data.
function fitOLS(pts) {
  const n = pts.length;
  let sx=0, sy=0, sxx=0, sxy=0;
  for (const {x,y} of pts) { const ly=Math.log(y); sx+=x; sy+=ly; sxx+=x*x; sxy+=x*ly; }
  const a = (n*sxy - sx*sy) / (n*sxx - sx*sx);
  const b = (sy - a*sx) / n;
  return { a, b, pred: x => Math.exp(a*x+b), dMo: a2mo(a), fitted: true };
}

// ── Decelerating trend: growth rate decays `decayFrac` per horizon doubling, starting `startMs`. ──
// In log-space dy/dt = a0·(1−d)^((y−y0)/ln2). Closed form: y = y0 − (1/k)·ln(1 − k·a0·τ), k = ln(1−d)/ln2.
function decelPred(fastFit, t, startMs, decayFrac) {
  const a0 = fastFit.a;
  if (t <= startMs) return fastFit.pred(t);
  const y0 = Math.log(fastFit.pred(startMs));
  const tau = t - startMs;
  const d = Math.min(Math.max(decayFrac, 0), 0.95);
  if (d <= 0) return Math.exp(y0 + a0*tau); // no decay → straight fast slope
  const k = Math.log(1 - d) / Math.LN2;     // < 0
  return Math.exp(y0 - (1/k) * Math.log(1 - k*a0*tau));
}

// Instantaneous doubling time (months) of the decelerating curve at time t.
function decelDoublingMonths(fastFit, t, startMs, decayFrac) {
  const a0 = fastFit.a;
  const d = Math.min(Math.max(decayFrac, 0), 0.95);
  if (t <= startMs || d <= 0) return a2mo(a0);
  const y0 = Math.log(fastFit.pred(startMs));
  const y = Math.log(decelPred(fastFit, t, startMs, decayFrac));
  return a2mo(a0 * Math.pow(1 - d, (y - y0) / Math.LN2));
}

// Days/weeks/months are the 8h/40h/160h units the right-hand axis labels use.
// Drops a trailing ".0" and singularises, so exactly one day reads "1 day".
const unit = (v, u, dp=1) => {
  const s = v.toFixed(dp);
  return `${s.replace(/\.0+$/, "")} ${s === (1).toFixed(dp) ? u : u + "s"}`;
};
// Unit ladder, in hours. Day/week/month are the 8h/40h/160h working units the
// right-hand axis labels already use; a year is 12 of those months (1920h),
// matching the "1 yr" tick.
const UNITS = [[1920, "year"], [160, "month"], [40, "week"], [8, "day"], [1, "hour"]];
// A value is shown in the largest unit it reaches at least TWO of. One rule at
// every step: 90 minutes stays "90 min", 8 hours stays "8 hours", 24 months
// becomes "2 years". Anything under two hours is minutes.
// The test is on the ROUNDED figure, which cuts both ways deliberately: the
// larger unit never prints "1.x", and the smaller one never prints a value
// sitting on the boundary — so "24 months" cannot appear, only "2 years".
const pickUnit = h => UNITS.find(([size]) => Number((h/size).toFixed(1)) >= 2);
const fmtH = h => {
  const u = pickUnit(h);
  if (u) return unit(h/u[0], u[1]);
  if (h<1/60) return `${(h*60).toFixed(2).replace(/\.?0+$/, "")} min`;
  return `${(h*60).toFixed(1).replace(/\.0$/, "")} min`;
};
// The active horizon also gets its raw hours, since days/weeks/months are
// 8-hour units and the conversion isn't obvious. Skipped when the chosen unit
// is hours or minutes already, where the gloss would just repeat itself.
const fmtHLong = h => {
  const u = pickUnit(h);
  return !u || u[0] === 1 ? fmtH(h)
    : `${fmtH(h)} (${h < 10 ? unit(h, "hour") : unit(h, "hour", 0)})`;
};

  val: { anthropic: { a: 1.337501, b: 23.7067, n: 10, r2: 0.973 }, mistral: { a: 1.608350, b: 21.0731, n: 5, r2: 0.822 }, openai: { a: 0.924117, b: 25.2022, n: 9, r2: 0.955 }, xai: { a: 1.478388, b: 23.3704, n: 5, r2: 0.956 } },
};

const FIN_NAME = {
  openai: "OpenAI", anthropic: "Anthropic", xai: "xAI", mistral: "Mistral AI",
  cohere: "Cohere", zai: "Z.ai (Zhipu)", moonshot: "Moonshot AI",
  deepseek: "DeepSeek", minimax: "MiniMax",
};
// Fixed color-assignment order for the finance legend — never re-derived from
// whichever companies happen to survive a series filter.
const FIN_ORDER = ["openai", "anthropic", "xai", "mistral", "cohere",
                   "deepseek", "zai", "moonshot", "minimax"];
const FIN_T0 = new Date("2024-01-01").getTime(); // fit epoch (finance_data.py)
const YR_MS = 365.25 * DAY_MS;
const finPred = f => ts => Math.exp(f.b + f.a * (ts - FIN_T0) / YR_MS);
const FCS = new Date(2021, 0, 1).getTime();
// Trend lines extrapolate six months past the day the page is opened — one
// uniform horizon that never silently ages, same idea as DECAY_START_DEFAULT.
const FCE = TODAY + YR_MS / 2;
const FIN_YTICKS = [1e6, 1e7, 1e8, 1e9, 1e10, 1e11, 1e12, 1e13];
// 1–3–10 ladder for the y-bounds: decade granularity alone wastes most of a
// decade above the top trend point.
const FIN_NICE = [1e6, 3e6, 1e7, 3e7, 1e8, 3e8, 1e9, 3e9, 1e10, 3e10,
                  1e11, 3e11, 1e12, 3e12, 1e13];
const fmtUSD = v => v >= 1e12 ? `$${+(v/1e12).toFixed(1)}T`
                  : v >= 1e9  ? `$${+(v/1e9).toFixed(1)}B`
                  : `$${+(v/1e6).toFixed(0)}M`;

// ── Shared wheel/pinch/drag zoom-pan, used by both charts. ──
// Domains: x in ms; y in the ACTIVE AXIS'S OWN UNITS (ln-hours for the TH
// view, score points for ECI/AECI, ln-USD for the finance chart). ly0/ly1 =
// null means "auto" — the y-axis tracks its computed bounds until the user
// explicitly zooms/pans. Zoom factors anchor on the cursor/pinch midpoint;
// both pans are incremental (the desktop one used to re-derive from a
// mousedown snapshot — same arithmetic, one code path now).
function useZoomPan({ chartRef, xMin, xMax, yMin, yMax, margin, yAxisW, height }) {
  const ZOOM_FACTOR = 0.15;
  const [zoom, setZoom] = useState({ x0: xMin, x1: xMax, ly0: null, ly1: null });
  const isZoomed = zoom.x0 !== xMin || zoom.x1 !== xMax || zoom.ly0 !== null || zoom.ly1 !== null;

  // Gesture handlers must survive re-renders MID-GESTURE: every setZoom
  // re-renders, and handlers rebuilt from fresh deps each render would tear
  // down and re-attach their listeners, resetting in-flight pinch state after
  // one step (the "one-step pinch" bug this structure fixed). So the current
  // parameters live in a ref the stable handlers read at event time, and
  // every listener attaches exactly once.
  const params = useRef({});
  params.current = { xMin, xMax, yMin, yMax, margin, yAxisW, height, isZoomed };

  const resetZoom = useCallback(() => {
    const p = params.current;
    setZoom({ x0: p.xMin, x1: p.xMax, ly0: null, ly1: null });
  }, []);

  const plotBounds = rect => {
    const p = params.current;
    return { left: p.margin.left + p.yAxisW, right: rect.width - p.margin.right,
             top: p.margin.top, bottom: p.height - p.margin.bottom };
  };

  // factor > 1 zooms out, < 1 zooms in; (mx, my) is the anchor in container px.
  const applyZoom = useCallback((factor, mx, my) => {
    const el = chartRef.current;
    if (!el) return;
    const p = params.current;
    const b = plotBounds(el.getBoundingClientRect());
    const fx = Math.max(0, Math.min(1, (mx - b.left) / (b.right - b.left)));
    const fy = Math.max(0, Math.min(1, (my - b.top) / (b.bottom - b.top))); // 0=top, 1=bottom
    setZoom(prev => {
      const xSpan = prev.x1 - prev.x0;
      const newXSpan = xSpan * factor;
      let nx0 = prev.x0 - (newXSpan - xSpan) * fx;
      let nx1 = nx0 + newXSpan;
      if (nx0 < p.xMin) { nx0 = p.xMin; nx1 = Math.min(p.xMax, nx0 + newXSpan); }
      if (nx1 > p.xMax) { nx1 = p.xMax; nx0 = Math.max(p.xMin, nx1 - newXSpan); }
      if (nx1 - nx0 >= p.xMax - p.xMin) { nx0 = p.xMin; nx1 = p.xMax; }
      // fy=1 (bottom) anchors near ly0, fy=0 (top) near ly1
      const ply0 = prev.ly0 ?? p.yMin, ply1 = prev.ly1 ?? p.yMax;
      const lySpan = ply1 - ply0;
      const newLySpan = lySpan * factor;
      let nly0 = ply0 - (newLySpan - lySpan) * (1 - fy);
      let nly1 = nly0 + newLySpan;
      if (nly0 < p.yMin) { nly0 = p.yMin; nly1 = Math.min(p.yMax, nly0 + newLySpan); }
      if (nly1 > p.yMax) { nly1 = p.yMax; nly0 = Math.max(p.yMin, nly1 - newLySpan); }
      if (nly1 - nly0 >= p.yMax - p.yMin) { nly0 = p.yMin; nly1 = p.yMax; }
      return { x0: nx0, x1: nx1, ly0: nly0, ly1: nly1 };
    });
  }, []);

  // Grab-style pan: dragging down moves the view to higher values.
  const applyPan = useCallback((dx, dy) => {
    const el = chartRef.current;
    if (!el) return;
    const p = params.current;
    const b = plotBounds(el.getBoundingClientRect());
    const plotW = b.right - b.left, plotH = b.bottom - b.top;
    setZoom(prev => {
      const xSpan = prev.x1 - prev.x0;
      const xShift = -(dx / plotW) * xSpan;
      let nx0 = prev.x0 + xShift, nx1 = prev.x1 + xShift;
      if (nx0 < p.xMin) { nx0 = p.xMin; nx1 = nx0 + xSpan; }
      if (nx1 > p.xMax) { nx1 = p.xMax; nx0 = nx1 - xSpan; }
      const ply0 = prev.ly0 ?? p.yMin, ply1 = prev.ly1 ?? p.yMax;
      const lySpan = ply1 - ply0;
      const lyShift = (dy / plotH) * lySpan;
      let nly0 = ply0 + lyShift, nly1 = ply1 + lyShift;
      if (nly0 < p.yMin) { nly0 = p.yMin; nly1 = nly0 + lySpan; }
      if (nly1 > p.yMax) { nly1 = p.yMax; nly0 = nly1 - lySpan; }
      return { x0: nx0, x1: nx1, ly0: nly0, ly1: nly1 };
    });
  }, []);

  // Wheel zoom (passive:false so preventDefault stops the page scrolling).
  useEffect(() => {
    const el = chartRef.current;
    if (!el) return;
    const onWheel = e => {
      e.preventDefault();
      const rect = el.getBoundingClientRect();
      applyZoom(e.deltaY > 0 ? 1 + ZOOM_FACTOR : 1 / (1 + ZOOM_FACTOR),
                e.clientX - rect.left, e.clientY - rect.top);
    };
    el.addEventListener("wheel", onWheel, { passive: false });
    return () => el.removeEventListener("wheel", onWheel);
  }, [applyZoom]);

  // Desktop drag-pan (window listeners so dragging outside the chart works).
  const isPanning = useRef(false);
  const panLast = useRef({ x: 0, y: 0 });
  const onPanStart = useCallback((e) => {
    if (!params.current.isZoomed) return;
    isPanning.current = true;
    panLast.current = { x: e.clientX, y: e.clientY };
    e.preventDefault();
  }, []);
  useEffect(() => {
    const onMove = e => {
      if (!isPanning.current) return;
      applyPan(e.clientX - panLast.current.x, e.clientY - panLast.current.y);
      panLast.current = { x: e.clientX, y: e.clientY };
    };
    const onUp = () => { isPanning.current = false; };
    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup", onUp);
    return () => {
      window.removeEventListener("mousemove", onMove);
      window.removeEventListener("mouseup", onUp);
    };
  }, [applyPan]);

  // Touch: two-finger pinch zoom; single-finger pan once zoomed. Pinch state
  // lives in a ref so a re-render (or even a re-attached effect) can never
  // reset it mid-gesture.
  const pinchDist = useRef(null);
  useEffect(() => {
    const el = chartRef.current;
    if (!el) return;
    const touchPt = e => {
      const t0 = e.touches[0], t1 = e.touches[1];
      const rect = el.getBoundingClientRect();
      return { dist: Math.hypot(t1.clientX - t0.clientX, t1.clientY - t0.clientY),
               cx: (t0.clientX + t1.clientX) / 2 - rect.left,
               cy: (t0.clientY + t1.clientY) / 2 - rect.top };
    };
    const onTouchStart = (e) => {
      if (e.touches.length === 2) {
        e.preventDefault();
        isPanning.current = false;
        pinchDist.current = touchPt(e).dist;
      } else if (e.touches.length === 1 && params.current.isZoomed) {
        isPanning.current = true;
        panLast.current = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      }
    };
    const onTouchMove = (e) => {
      if (e.touches.length === 2 && pinchDist.current != null) {
        e.preventDefault();
        isPanning.current = false;
        const p = touchPt(e);
        applyZoom(pinchDist.current / p.dist, p.cx, p.cy); // pinch in = zoom out
        pinchDist.current = p.dist;
      } else if (e.touches.length === 1 && isPanning.current && params.current.isZoomed) {
        e.preventDefault();
        const t = e.touches[0];
        applyPan(t.clientX - panLast.current.x, t.clientY - panLast.current.y);
        panLast.current = { x: t.clientX, y: t.clientY };
      }
    };
    const onTouchEnd = () => { pinchDist.current = null; isPanning.current = false; };
    el.addEventListener("touchstart", onTouchStart, { passive: false });
    el.addEventListener("touchmove", onTouchMove, { passive: false });
    el.addEventListener("touchend", onTouchEnd);
    return () => {
      el.removeEventListener("touchstart", onTouchStart);
      el.removeEventListener("touchmove", onTouchMove);
      el.removeEventListener("touchend", onTouchEnd);
    };
  }, [applyZoom, applyPan]);

  return { zoom, isZoomed, resetZoom, onPanStart, isPanning };
}

function FinanceChart({ isMobile, vpH }) {
  const [series, setSeries] = useState("rev"); // "rev" | "val"
  // Tooltip target: r = a report dot, l = a point on a fitted trend line.
  const [tipState, setTipState] = useState({ r: null, l: null, cx: 0, cy: 0, opacity: 0 });
  const lastTip = useRef(null);
  const fadeTimer = useRef(null);
  const dotPositions = useRef([]);
  const scaleRef = useRef(null); // plot scales, captured by FinDots each render
  const chartRef = useRef(null);
  if (tipState.r || tipState.l) lastTip.current = tipState;

  const pts = useMemo(() =>
    FIN_RAW.filter(r => r.s === series)
           .map(r => ({ ...r, ts: new Date(r.d).getTime() })), [series]);
  const fits = FIN_FITS[series];
  const comps = useMemo(() => FIN_ORDER.filter(c => pts.some(r => r.c === c)), [pts]);
  // Legend-toggled companies. DISPLAY ONLY: hiding one rescales the axes to
  // what's shown but never refits or reshapes anyone's trend. The set is
  // shared across the Revenue/Valuations views (same entity, same choice).
  const [hidden, setHidden] = useState(() => new Set());
  const visPts = useMemo(() => pts.filter(r => !hidden.has(r.c)), [pts, hidden]);
  const visComps = useMemo(() => comps.filter(c => !hidden.has(c)), [comps, hidden]);
  // A trend line spans [company's first report, FCE] — extrapolation is capped
  // by the same six-month horizon for everyone.
  const firstTs = useMemo(() => {
    const f = {};
    for (const r of pts) if (!(r.c in f) || r.ts < f[r.c]) f[r.c] = r.ts;
    return f;
  }, [pts]);
  // Most recent report per company, for the line tooltip's "same slope from
  // last report" reading (fitted growth rate re-anchored through it).
  const lastPt = useMemo(() => {
    const f = {};
    for (const r of pts) if (!(r.c in f) || r.ts > f[r.c].ts) f[r.c] = r;
    return f;
  }, [pts]);
  const trendData = useMemo(() => {
    const d = [], step = 7 * DAY_MS;
    for (let t = FCS; t <= FCE; t += step) {
      const row = { ts: t };
      for (const c of visComps)
        row[c] = (fits[c] && t >= firstTs[c]) ? finPred(fits[c])(t) : null;
      d.push(row);
    }
    return d;
  }, [visComps, fits, firstTs]);

  const [yLo, yHi] = useMemo(() => {
    let lo = Infinity, hi = -Infinity;
    for (const r of visPts) { if (r.v < lo) lo = r.v; if (r.v > hi) hi = r.v; }
    for (const d of trendData) for (const c of visComps)
      if (d[c] != null && d[c] > hi) hi = d[c];
    if (!isFinite(lo)) return [1e8, 1e12]; // every company toggled off
    const floor = [...FIN_NICE].reverse().find(t => t <= lo) ?? FIN_NICE[0];
    const ceil = FIN_NICE.find(t => t >= hi * 1.04) ?? FIN_NICE[FIN_NICE.length - 1];
    return [floor, ceil];
  }, [visPts, trendData, visComps]);

  const xTicks = useMemo(() => {
    const t = [];
    for (let y = 2021; new Date(y, 0, 1).getTime() <= FCE; y++)
      t.push(new Date(y, 0, 1).getTime());
    return t;
  }, []);

  const CHART_MARGIN = isMobile ? { top: 10, right: 16, left: 2, bottom: 30 }
                                : { top: 20, right: 90, left: 15, bottom: 40 };
  const YAXIS_W = isMobile ? 44 : 62;
  // Same sizing rule as the capability chart above — the two plots read as
  // equals, not as a chart and its footnote.
  const H = isMobile ? 400 : clamp(540, Math.round(vpH * 0.625), 950);

  // Same zoom/pan as the capability chart; y zoom state lives in ln(USD).
  const { zoom, isZoomed, resetZoom, onPanStart, isPanning } = useZoomPan({
    chartRef, xMin: FCS, xMax: FCE, yMin: Math.log(yLo), yMax: Math.log(yHi),
    margin: CHART_MARGIN, yAxisW: YAXIS_W, height: H,
  });
  const xDomain = [zoom.x0, zoom.x1];
  const yDomain = [Math.exp(zoom.ly0 ?? Math.log(yLo)), Math.exp(zoom.ly1 ?? Math.log(yHi))];

  const onMouseMove = useCallback((e) => {
    if (isPanning.current) return;
    const el = chartRef.current;
    if (!el) return;
    const rect = el.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    let next = null, best = 18;
    for (const dp of dotPositions.current) {
      const dist = Math.hypot(dp.cx - mx, dp.cy - my);
      if (dist < best) { best = dist; next = { r: dp.r, cx: dp.cx, cy: dp.cy }; }
    }
    // No dot nearby: try the trend lines. Five of them share the plot, so the
    // hit band is deliberately narrow (5px) and dots always win over lines.
    const sc = scaleRef.current;
    if (!next && sc && mx >= sc.px0 && mx <= sc.px1 && my >= sc.py0 && my <= sc.py1) {
      const ts = sc.xS.invert ? sc.xS.invert(mx)
               : FCS + (mx - sc.px0) / (sc.px1 - sc.px0) * (FCE - FCS);
      let bestL = 5, hit = null;
      for (const c of visComps) {
        if (!fits[c] || ts < firstTs[c] || ts > FCE) continue;
        const d = Math.abs(my - sc.yS(finPred(fits[c])(ts)));
        if (d < bestL) { bestL = d; hit = { c, ts, v: finPred(fits[c])(ts) }; }
      }
      if (hit) next = { l: hit, cx: mx, cy: my };
    }
    if (next) {
      clearTimeout(fadeTimer.current);
      setTipState({ r: null, l: null, ...next, opacity: 1 });
    } else if (tipState.opacity === 1) {
      setTipState(prev => ({ ...prev, opacity: 0 }));
      fadeTimer.current = setTimeout(() => {
        setTipState(prev => prev.opacity === 0 ? { ...prev, r: null, l: null } : prev);
      }, 1000);
    }
  }, [tipState.opacity, visComps, fits, firstTs]);
  const onMouseLeave = useCallback(() => {
    if (tipState.r || tipState.l) {
      setTipState(prev => ({ ...prev, opacity: 0 }));
      fadeTimer.current = setTimeout(() => {
        setTipState(prev => prev.opacity === 0 ? { ...prev, r: null, l: null } : prev);
      }, 1000);
    }
  }, [tipState.r, tipState.l]);

  const FinDots = (props) => {
    const xM = props.xAxisMap, yM = props.yAxisMap;
    if (!xM || !yM) return null;
    const xS = xM[Object.keys(xM)[0]]?.scale, yS = yM[Object.keys(yM)[0]]?.scale;
    if (!xS || !yS) return null;
    const xr = xS.range(), yr = yS.range();
    const px0 = Math.min(xr[0], xr[1]), px1 = Math.max(xr[0], xr[1]);
    const py0 = Math.min(yr[0], yr[1]), py1 = Math.max(yr[0], yr[1]);
    scaleRef.current = { xS, yS, px0, px1, py0, py1 }; // for the line-hover hit test
    const positions = [];
    const els = visPts.map((r, i) => {
      const cx = xS(r.ts), cy = yS(r.v);
      if (isNaN(cx) || isNaN(cy)) return null;
      if (cx >= px0 && cx <= px1 && cy >= py0 && cy <= py1) positions.push({ r, cx, cy });
      const c = COL[r.c];
      return (<g key={r.c + r.d + i} className="mp">
        <circle cx={cx} cy={cy} r={4.5} fill={c}/>
        <text className="ml" x={cx + 8} y={cy - 8} fill={c} fontSize={11}
          fontFamily={FONT} fontWeight={500}>{FIN_NAME[r.c]}</text>
      </g>);
    });
    dotPositions.current = positions;
    // Company labels at each fitted line's right end — the VISIBLE right end,
    // so they track the line when zoomed — nudged apart when two trends land
    // within a text height of each other (OpenAI and Anthropic valuations end
    // ~8px apart).
    const xEnd = Math.min(FCE, zoom.x1);
    const labels = isMobile ? [] : visComps.filter(c => fits[c] && firstTs[c] <= zoom.x1).map(c => ({
      c, y: yS(finPred(fits[c])(xEnd)),
    })).filter(l => !isNaN(l.y) && l.y >= py0 - 6 && l.y <= py1 + 6)
      .sort((a, b) => a.y - b.y);
    for (let i = 1; i < labels.length; i++)
      if (labels[i].y - labels[i-1].y < 13) labels[i].y = labels[i-1].y + 13;
    return (<g>
      <defs><clipPath id="finClip"><rect x={px0} y={py0} width={px1-px0} height={py1-py0}/></clipPath></defs>
      <g clipPath="url(#finClip)">{els}</g>
      {labels.map(l => (
        <text key={"lbl"+l.c} x={px1 + 5} y={l.y + 4} fill={COL[l.c]} fontSize={11}
          fontFamily={FONT} fontWeight={500}>{FIN_NAME[l.c]}</text>
      ))}
    </g>);
  };

  const growthLabel = c => {
    const f = fits[c];
    if (!f) return null;
    return `${Math.exp(f.a).toFixed(1)}×/yr`;
  };

  return (<>
    <h2 style={{fontFamily:FONT_D,fontSize:20,fontWeight:700,color:"#eee",margin:"40px 0 4px",letterSpacing:"-0.02em"}}>
      AI Lab Finance Trends
    </h2>
    <p style={{fontSize:14,color:"#888",marginBottom:14,lineHeight:1.5,maxWidth:PROSE_W}}>
      Reported annualized revenue and post-money valuations of frontier AI labs
      (dots), with per-company exponential fits (dashed). Same capability chart
      colors; hover a dot for the figure, its type and its source.
    </p>
    <div style={{display:"flex",gap:0,marginBottom:10,fontFamily:FONT_D,fontSize:12}}>
      {[["rev","Revenue"],["val","Valuations"]].map(([s,lb],i)=>(
        <button key={s} onClick={()=>{setSeries(s);resetZoom();}} style={{
          background:series===s?"#2a2a40":"transparent",color:series===s?"#eee":"#777",
          border:"1px solid #444",borderLeft:i===0?"1px solid #444":"none",
          borderRadius:i===0?"6px 0 0 6px":"0 6px 6px 0",
          padding:"5px 14px",cursor:"pointer",fontFamily:FONT_D,fontSize:12}}>{lb}</button>
      ))}
    </div>
    <div ref={chartRef} style={{position:"relative",cursor:isZoomed?"grab":"default"}}
      onMouseDown={onPanStart} onMouseMove={onMouseMove} onMouseLeave={onMouseLeave}>
      {lastTip.current && (()=>{
        const {r,l,cx,cy}=lastTip.current;
        const key = (r||l).c;
        const containerW = chartRef.current ? chartRef.current.getBoundingClientRect().width : 900;
        const flipX=cx>containerW*0.6;
        const box = {position:"absolute",left:flipX?Math.max(4,cx-190):cx+20,top:Math.max(10,cy-40),
          background:"#1a1a2e",border:"1px solid "+COL[key],borderRadius:6,padding:"10px 14px",
          fontFamily:FONT,fontSize:13,color:"#ccc",lineHeight:1.7,pointerEvents:"none",zIndex:10,
          minWidth:170,opacity:tipState.opacity,transition:"opacity 1s"};
        if (r) {
          const ds=new Date(r.d).toLocaleString("en-US",{month:"short",day:"numeric",year:"numeric"});
          return (<div style={box}>
            <div style={{fontWeight:700,color:COL[r.c],marginBottom:2}}>{FIN_NAME[r.c]}</div>
            <div>{ds}</div>
            <div>{r.s==="rev"?"Annualized revenue":"Valuation"}: <b style={{color:"#eee"}}>{fmtUSD(r.v)}</b></div>
            {r.t && <div style={{fontSize:11,color:"#8fa8c8"}}>{r.t}{r.cf?` · ${r.cf.toLowerCase()}`:""}</div>}
            {r.src && <div style={{fontSize:11,color:"#777"}}>via {r.src}</div>}
          </div>);
        }
        // Trend-line hover: where the fit says this company "should" be at the
        // cursor's date. The fit can vanish mid-fade on a series switch, so
        // guard it. Tooltip stays put during the fadeout (no live cursor data),
        // matching the dot behavior.
        const lf = FIN_FITS[series][l.c];
        const ds=new Date(l.ts).toLocaleString("en-US",{month:"short",year:"numeric"});
        return (<div style={box}>
          <div style={{fontWeight:700,color:COL[l.c],marginBottom:2}}>{FIN_NAME[l.c]} trend</div>
          <div>{ds}</div>
          <div>{series==="rev"?"Trend revenue":"Trend valuation"}: <b style={{color:"#eee"}}>{fmtUSD(l.v)}</b></div>
          {lf && lastPt[l.c] && l.ts >= lastPt[l.c].ts && (()=>{ const lp = lastPt[l.c];
            return (<div>Trend from last report{" "}
              ({new Date(lp.d).toLocaleString("en-US",{month:"short",year:"numeric"})}, {fmtUSD(lp.v)}):{" "}
              <b style={{color:"#eee"}}>{fmtUSD(lp.v * Math.exp(lf.a * (l.ts - lp.ts) / YR_MS))}</b></div>);})()}
          {lf && <div style={{fontSize:11,color:"#8fa8c8"}}>
            {Math.exp(lf.a).toFixed(1)}×/yr OLS fit (n={lf.n}, R²={lf.r2.toFixed(2)})</div>}
          {l.ts > TODAY && <div style={{fontSize:11,color:"#777"}}>extrapolated</div>}
        </div>);
      })()}
      <ResponsiveContainer width="100%" height={H}>
        <ComposedChart data={trendData} margin={CHART_MARGIN}>
          <CartesianGrid stroke="#2a2a40" strokeDasharray="3 3"/>
          <XAxis dataKey="ts" type="number" domain={xDomain} ticks={xTicks.filter(t=>t>=zoom.x0&&t<=zoom.x1)}
            tickFormatter={ts=>`${new Date(ts).getFullYear()}`}
            stroke="#666" tick={{fontSize:isMobile?10:12,fontFamily:FONT,fill:"#999"}} axisLine={{stroke:"#444"}} allowDataOverflow/>
          <YAxis scale="log" domain={yDomain} allowDataOverflow
            ticks={FIN_YTICKS.filter(t=>t>=yDomain[0]&&t<=yDomain[1])} tickFormatter={fmtUSD}
            stroke="#666" tick={{fontSize:isMobile?9:11,fontFamily:FONT,fill:"#999"}} axisLine={{stroke:"#444"}} width={YAXIS_W}/>
          <ReferenceLine x={TODAY} stroke="#f0c050" strokeDasharray="4 4" strokeWidth={1}
            label={{value:"Today",position:"top",fill:"#f0c050",fontSize:11,fontFamily:FONT_D}}/>
          {visComps.map(c => fits[c] && <Line key={c} dataKey={c} stroke={COL[c]} strokeWidth={2}
            strokeDasharray="8 4" dot={false} isAnimationActive={false}/>)}
          <Customized component={FinDots}/>
        </ComposedChart>
      </ResponsiveContainer>
      {isZoomed && <button onClick={resetZoom} style={{position:"absolute",top:isMobile?8:28,right:isMobile?20:96,
        background:"#2a2a40",color:"#ccc",border:"1px solid #555",borderRadius:4,padding:"4px 10px",
        fontSize:11,fontFamily:FONT_D,cursor:"pointer",zIndex:5}}>Reset zoom</button>}
    </div>
    <div style={{display:"flex",flexWrap:"wrap",gap:16,marginTop:12,fontSize:13,color:"#999"}}>
      {comps.map(c => { const off = hidden.has(c); return (
        <div key={c} onClick={()=>{
            setHidden(prev => { const n = new Set(prev); n.has(c) ? n.delete(c) : n.add(c); return n; });
            resetZoom(); // hiding a giant rescales the axes; stale zoom would mislead
          }}
          style={{display:"flex",alignItems:"center",gap:5,cursor:"pointer",userSelect:"none",
            opacity:off?0.45:1,transition:"opacity 0.15s"}}>
          <svg width={10} height={10}><circle cx={5} cy={5} r={3.5}
            fill={off?"#12121f":COL[c]} stroke={COL[c]} strokeWidth={1.2}/></svg>
          <span>{FIN_NAME[c]}</span>
          {fits[c] && <span style={{color:"#777"}}>
            {growthLabel(c)} (n={fits[c].n}, R²={fits[c].r2.toFixed(2)})</span>}
        </div>
      );})}
    </div>
    <p style={{fontSize:12,color:"#666",marginTop:12,lineHeight:1.5,maxWidth:PROSE_W}}>
      Log-scale Y-axis (USD). {series === "rev"
        ? "One uniform rule: every dated full-company annualized-revenue report in \
Epoch's dataset counts, whatever its flavor (ARR, run rate, interpolated) and \
confidence tier — those are surfaced in tooltips, not filtered on."
        : "One uniform rule: every closed funding round with a dated post-money \
valuation counts, primary and secondary alike. A valuation only moves when a \
round closes, so dots are pricing events, not a continuous series."}{" "}
      Dashed lines are unweighted OLS fits of ln($) on time for companies with
      ≥4 qualifying points, extended six months past today; the rest plot as
      dots only. Legend chips toggle companies in and out of the display —
      hiding one rescales the axes but never refits any trend. These are
      reported figures at irregular intervals — the trends measure growth in
      what gets reported. Data:{" "}
      <a href="https://epoch.ai/data/ai-companies" style={{color:"#7eb8da",textDecoration:"none"}}
        target="_blank" rel="noopener noreferrer">Epoch AI, AI Companies Hub</a> (CC-BY 4.0),
      snapshot in <code style={{fontSize:11}}>analysis/data/</code>.
    </p>
  </>);
}

function App() {
  const [extendSlow, setExtendSlow] = useState(false);
  const [showFast, setShowFast] = useState(true);
  const [showDecel, setShowDecel] = useState(false); // hypothetical — opt in
  const [useP80, setUseP80] = useState(false);
  // Hide models whose value for the ACTIVE view's metric is not a real
  // measurement: predicted diamonds in the TH view; imputed/estimated points
  // in the score views (where the frontier trend then refits to measured data).
  const [testedOnly, setTestedOnly] = useState(false);
  const [yMode, setYMode] = useState("th"); // "th" | "eci" | "aeci"
  const isScore = yMode !== "th";
  const [pinScore, setPinScore] = useState(false); // pin score fast trend to the system card's 13.5 pts/yr
  const [predBasis, setPredBasis] = useState("default"); // which fit converts indices to predicted horizons
  const [basisTip, setBasisTip] = useState(null); // which basis button is hovered/focused
  const [fitFast, setFitFast] = useState(false); // false = fixed 3.5-mo, true = fitted slope
  const [decayPct, setDecayPct] = useState(20);   // % growth-rate decay per horizon doubling
  const [decayStartStr, setDecayStartStr] = useState(DECAY_START_DEFAULT); // when the slowdown begins
  const [tipState, setTipState] = useState({ model: null, cx: 0, cy: 0, opacity: 0 });
  const lastTip = useRef(null); // persists content during fadeout
  const fadeTimer = useRef(null);
  const dotPositions = useRef([]); // [{m, cx, cy}] updated by Dots renderer
  const chartRef = useRef(null);
  if (tipState.model) lastTip.current = tipState;

  // ── Viewport tracking: drives the mobile breakpoint and the responsive sizing ──
  const [vp, setVp] = useState(() => ({ w: window.innerWidth, h: window.innerHeight }));
  useEffect(() => {
    const onResize = () => setVp({ w: window.innerWidth, h: window.innerHeight });
    window.addEventListener("resize", onResize);
    return () => window.removeEventListener("resize", onResize);
  }, []);
  const isMobile = vp.w < 600;

  const models = useMemo(() => M.map(m => {
    const ts = new Date(m.d).getTime();
    if (useP80) return { ...m, ts, p: m.p80, lo: m.lo80, hi: m.hi80 };
    return { ...m, ts };
  }), [useP80]);

  // Predicted points (index conversions) — never enter the SOTA set or trend
  // fits. pm50/pm80 are minutes under the selected conversion basis.
  const predModels = useMemo(() => PRED_RAW.map(m => {
    let pm50 = m.p, pm80 = m.p80; // "default": generated per-model route
    const calc = PRED_BASES[predBasis];
    if (calc) [pm50, pm80] = calc({ ...INFO[m.n], l: m.l });
    return { ...m, ts: new Date(m.d).getTime(), pred: true,
             pm50, pm80, p: (useP80 ? pm80 : pm50) / 60 };
  }), [useP80, predBasis]);

  // Which conversion route a predicted point actually took, for its tooltip.
  // On "default" that is the per-model string baked into PRED_RAW; on an
  // explicit basis it is that fit — except "lab", which silently falls back to
  // the pooled line for labs that have no ANCOVA intercept.
  const basisNote = m => {
    if (predBasis === "default") return m.basis;
    if (predBasis === "aeci") return "AECI fit (Claude-only regression)";
    if (predBasis === "eci") return "pooled cross-lab ECI fit";
    return FITS.eciP50Lab[m.l] != null ? `${m.l} lab-adjusted ECI fit`
                                       : `pooled ECI fit (no ${m.l} intercept)`;
  };

  // ── Score-mode data (ECI / AECI y-axis): sc = active score, imp = imputed
  // through the fitted ECI<->AECI line, other = the source value it came from. ──
  const idxModels = useMemo(() => {
    if (!isScore) return [];
    return IDX_RAW.map(m => ({
      ...m, ts: new Date(m.d).getTime(), idx: true,
      sc: yMode === "eci" ? m.eci : m.aeci,
      imp: yMode === "eci" ? !!m.eciImp : !!m.aeciImp,
      est: yMode === "eci" ? !!m.eciEst : !!m.aeciEst,
      // measured AECI values carry system-card CIs; ECI has none published
      lo: yMode === "aeci" && !m.aeciImp ? m.aeciLo : null,
      hi: yMode === "aeci" && !m.aeciImp ? m.aeciHi : null,
    })).filter(m => !testedOnly || (!m.imp && !m.est));
  }, [yMode, isScore, testedOnly]);

  // Running-max frontier on the active score (same rule as the time-horizon
  // SOTA set: a model is frontier if it beats every earlier one), over models
  // whose score for THIS view was actually measured. Derived scores — imputed
  // through the ECI<->AECI line, or estimated from a METR horizon — are still
  // plotted, but must not define the frontier: they carry no information the
  // fit that produced them didn't already have, so letting them set the trend
  // would be the model steering its own input. Concretely it was suppressing
  // real Epoch measurements, e.g. Mythos 5's imputed ECI outranking Fable 5's
  // measured one for the same underlying model on the same day.
  const isIdxFrontier = useMemo(() => {
    const sorted = idxModels.filter(m => !m.est && !m.imp).sort((a,b) => (a.ts - b.ts) || (b.sc - a.sc));
    const set = new Set(); let mx = -Infinity;
    for (const m of sorted) { if (m.sc > mx) { set.add(m.n + m.d); mx = m.sc; } }
    return m => set.has(m.n + m.d);
  }, [idxModels]);

  // Linear frontier trends: score = a + b·t over frontier models, in pts/yr,
  // split at the same mid-2024 break as the time-horizon fits (GPT-4o ends the
  // slow era, Claude 3.5 Sonnet opens the fast one).
  const scoreFit = useMemo(() => {
    if (!isScore) return null;
    const lin = pts => {
      const n = pts.length;
      // A segment can be left with too few frontier points to define a line —
      // the AECI view's pre-mid-2024 era has only one, since AECI is measured
      // for Anthropic models only. Report no trend rather than a NaN one.
      if (n < 2) return null;
      let sx=0, sy=0, sxx=0, sxy=0;
      for (const m of pts) { sx+=m.ts; sy+=m.sc; sxx+=m.ts*m.ts; sxy+=m.ts*m.sc; }
      const b = (n*sxy - sx*sy) / (n*sxx - sx*sx);
      const a = (sy - b*sx) / n;
      return { pred: t => a + b*t, slope: b, perYr: b * 365.25 * DAY_MS, n, pinned: false };
    };
    // Fixed-slope fit (system card's frontier rate): optimize intercept only.
    const pin = (pts, perYr) => {
      const b = perYr / (365.25 * DAY_MS);
      let s = 0;
      for (const m of pts) s += m.sc - b * m.ts;
      const a = s / pts.length;
      return { pred: t => a + b*t, slope: b, perYr, n: pts.length, pinned: true };
    };
    const slowCut = new Date(2024,5,1).getTime(); // same boundary as the TH fits
    const pts = idxModels.filter(isIdxFrontier);
    const fastPts = pts.filter(m => m.ts >= slowCut);
    return { slow: lin(pts.filter(m => m.ts < slowCut)),
             fast: pinScore ? pin(fastPts, 13.5) : lin(fastPts) };
  }, [idxModels, isIdxFrontier, isScore, pinScore]);

  // ── SOTA frontier for the active horizon: a model is SOTA if its horizon exceeds
  // every earlier-released model. p50 and p80 yield different frontiers, so this set
  // (and therefore both the fits and the filled/hollow dots) tracks the current mode. ──
  const isSota = useMemo(() => {
    const sorted = [...models].sort((a,b) => (a.ts - b.ts) || (b.p - a.p));
    const set = new Set(); let mx = -Infinity;
    for (const m of sorted) { if (m.p > mx) { set.add(m.n + m.d); mx = m.p; } }
    return m => set.has(m.n + m.d);
  }, [models]);

  // Most recent frontier point, for the tooltip's "Trend from <last point>"
  // reading: the fitted slope re-anchored through the newest point that beats
  // everything before it. DELIBERATE special case (owner's call): unlike the
  // frontier and trend fits, predicted/imputed/estimated points count here —
  // the anchor is the newest frontier-setting mark on screen, whatever its
  // provenance. Display-only arithmetic; nothing feeds back into any fit.
  // With "tested only" on the derived points are hidden, so the anchor
  // reverts to the newest measured point rather than something invisible.
  const lastSota = useMemo(() => {
    const cands = [...models, ...(testedOnly ? [] : predModels)].sort((a, b) => a.ts - b.ts);
    let m0 = null, mx = -Infinity;
    for (const m of cands) if (m.p > mx) { mx = m.p; m0 = m; }
    return m0;
  }, [models, predModels, testedOnly]);
  const lastIdx = useMemo(() => {
    const sorted = [...idxModels].sort((a, b) => a.ts - b.ts);
    let m0 = null, mx = -Infinity;
    for (const m of sorted) if (m.sc > mx) { mx = m.sc; m0 = m; }
    return m0;
  }, [idxModels]);

  const {allFit, recFit} = useMemo(() => {
    const slowCut = new Date(2024,5,1).getTime(); // Jun 1 2024: GPT-4o (May 13) → slow, Claude 3.5 Sonnet (Jun 20) → fast
    const slowPts = models.filter(m=>isSota(m) && m.ts < slowCut);
    const fastPts = models.filter(m=>isSota(m) && m.ts >= slowCut);
    return {
      // Slow line always fixed at 7-mo doubling; fast line toggles fixed 3.5-mo ↔ fitted slope.
      allFit: fitFixed(slowPts.map(m=>({x:m.ts, y:m.p})), 7),
      recFit: fitFast ? fitOLS(fastPts.map(m=>({x:m.ts, y:m.p})))
                      : fitFixed(fastPts.map(m=>({x:m.ts, y:m.p})), 3.5),
    };
  }, [models, isSota, fitFast]);

  const decayStartMs = useMemo(() => {
    const t = new Date(decayStartStr).getTime();
    return isNaN(t) ? new Date(DECAY_START_DEFAULT).getTime() : t;
  }, [decayStartStr]);
  const decayFrac = Math.min(Math.max(decayPct/100, 0), 0.95);

  // Score-space slowdown: growth rate decays decayFrac per TH-doubling-equivalent
  // of score gained (K points = ln2 / TH-fit slope), mirroring the TH scenario.
  const scoreDecel = useMemo(() => {
    if (!scoreFit || !scoreFit.fast) return null;
    const K = Math.LN2 / (yMode === "eci" ? FITS.eciP50.b : FITS.aeciP50.b);
    return t => {
      const f = scoreFit.fast, r0 = f.slope;
      if (t <= decayStartMs || decayFrac <= 0) return f.pred(t);
      const y0 = f.pred(decayStartMs), tau = t - decayStartMs;
      const k = Math.log(1 - decayFrac) / K; // < 0
      return y0 - (1/k) * Math.log(1 - k * r0 * tau);
    };
  }, [scoreFit, yMode, decayStartMs, decayFrac]);

  const CUT = new Date(2024,8,11).getTime(); // era boundary (o1-preview, Sep 11 2024)
  const trendData = useMemo(() => {
    const d = [], step = 7*86400000;
    for (let t=CS; t<=CE; t+=step) {
      const decelVal = (showDecel && t >= CUT) ? decelPred(recFit, t, decayStartMs, decayFrac) : null;
      d.push({
        ts: t,
        slow: (extendSlow || t <= CUT) ? allFit.pred(t) : null,
        fast: (showFast && t >= CUT) ? recFit.pred(t) : null,
        decel: decelVal,
        // Local doubling time (months) per series, for the line tooltip.
        slowDbl: allFit.dMo,
        fastDbl: recFit.dMo,
        decelDbl: decelVal == null ? null : decelDoublingMonths(recFit, t, decayStartMs, decayFrac),
      });
    }
    return d;
  }, [allFit, recFit, extendSlow, showFast, showDecel, decayStartMs, decayFrac]);

  // Score-mode trend series: the split frontier fits sampled weekly, changing
  // over at the same era boundary (CUT) the time-horizon lines use, plus the
  // slowdown scenario. Same toggles as the TH view.
  const scoreTrendData = useMemo(() => {
    if (!scoreFit) return [];
    const d = [], step = 7*86400000;
    for (let t=CS; t<=CE; t+=step) d.push({
      ts: t,
      scSlow: (scoreFit.slow && (extendSlow || t <= CUT)) ? scoreFit.slow.pred(t) : null,
      scFast: (scoreFit.fast && showFast && t >= CUT) ? scoreFit.fast.pred(t) : null,
      scDecel: (scoreDecel && showDecel && t >= CUT) ? scoreDecel(t) : null,
    });
    return d;
  }, [scoreFit, scoreDecel, extendSlow, showFast, showDecel]);

  // Score y-range: normally just the models, letting the trend lines run off the
  // top as they always have — scores are linear, so fitting the 2029 end of a
  // straight trend would squash every datapoint into the bottom third for no
  // gain. The exception is the slowdown scenario: its whole point is the gap
  // that opens against the unslowed trend, and that gap sits well above the
  // data, so while it is displayed the ceiling grows to frame both curves.
  // (The TH view's yhiDyn fits trends unconditionally; it can afford to,
  // being log-scaled.)
  const scoreDomain = useMemo(() => {
    if (!isScore) return null;
    let lo = Infinity, hi = -Infinity;
    for (const m of idxModels) { if (m.sc < lo) lo = m.sc; if (m.sc > hi) hi = m.sc; }
    if (showDecel)
      for (const d of scoreTrendData)
        for (const k of ["scFast","scDecel"])
          if (d[k] != null && d[k] > hi) hi = d[k];
    return [Math.floor((lo - 3) / 5) * 5, Math.ceil((hi + 3) / 5) * 5];
  }, [idxModels, isScore, scoreTrendData, showDecel]);
  // Keep the tick count sane as the range grows with the extended trends.
  const scoreTicks = useMemo(() => {
    if (!scoreDomain) return [];
    const step = (scoreDomain[1] - scoreDomain[0]) > 60 ? 10 : 5;
    const t = [];
    for (let v = scoreDomain[0]; v <= scoreDomain[1]; v += step) t.push(v);
    return t;
  }, [scoreDomain]);

  // Auto-fit the zoomed-out y-ceiling to the topmost visible trend line (and any
  // model CI that reaches higher), rounded up to a labelled tick. Reacts to the
  // horizon/toggle state so e.g. extending to 2029 keeps the fast trend in frame.
  const yhiDyn = useMemo(() => {
    let dataMx = 1; // never collapse below 1 hour
    for (const m of models) { const h = m.hi != null ? m.hi : m.p; if (h > dataMx) dataMx = h; }
    if (!testedOnly) for (const m of predModels) if (m.p > dataMx) dataMx = m.p;
    let mx = dataMx;
    for (const d of trendData)
      for (const k of ["slow","fast","decel"]) if (d[k] != null && d[k] > mx) mx = d[k];
    // Trend lines are extrapolations and grow without bound: at the 2030 edge the
    // 3.5-month doubling reaches ~65 years, which would add a decade of unlabelled
    // axis and squash every measured point into the lower half. So they may not
    // push the ceiling past the top labelled tick — they clip there instead.
    // Real data and predictions still raise it if they ever climb that high.
    const trendCap = Math.max(niceCeil(dataMx), YTICKS[YTICKS.length - 1]);
    return Math.min(niceCeil(mx), trendCap);
  }, [trendData, models, predModels, testedOnly]);
  const yLogBot = Math.log(YLO), yLogTop = Math.log(yhiDyn);
  // Zoom state (ly0/ly1) lives in the active axis's units: ln(hours) for the
  // time-horizon view, raw score points for ECI/AECI. Mode switches reset zoom,
  // so the units never mix.
  const yUnitBot = isScore ? scoreDomain[0] : yLogBot;
  const yUnitTop = isScore ? scoreDomain[1] : yLogTop;

  const CHART_MARGIN = isMobile ? { top: 10, right: 16, left: 2, bottom: 30 } : { top: 20, right: 90, left: 15, bottom: 40 };
  const YAXIS_W = isMobile ? 44 : 62;
  // Responsive sizing. Height is a fixed share of the viewport (5/8) rather than
  // whatever is left after the ~560px of non-chart chrome: fitting the chrome
  // exactly kept 1080p scroll-free but left the plot squat. This costs ~130px of
  // scroll at 1080p and ~50px at 1440p, which is the trade for a plot that isn't
  // letterboxed.
  const CHART_HEIGHT = isMobile ? 400 : clamp(540, Math.round(vp.h * 0.625), 950);
  // Width is then capped by height at 2:1, so the shell can't balloon to the
  // 1600 ceiling and undo the height increase — past that ratio the plot
  // flattens the exponential this chart exists to show. NON_PLOT_W is what the
  // margins and y-axis take off the top before any of it reaches the plot.
  const NON_PLOT_W = CHART_MARGIN.left + YAXIS_W + CHART_MARGIN.right;
  const PLOT_H = CHART_HEIGHT - CHART_MARGIN.top - CHART_MARGIN.bottom;
  const SHELL_W = isMobile ? "100%"
    : clamp(900, Math.min(vp.w - 48, PLOT_H * 2.0 + NON_PLOT_W), 1600);
  const { zoom, isZoomed, resetZoom, onPanStart, isPanning } = useZoomPan({
    chartRef, xMin: CS, xMax: CE, yMin: yUnitBot, yMax: yUnitTop,
    margin: CHART_MARGIN, yAxisW: YAXIS_W, height: CHART_HEIGHT,
  });

  // Derived domains from zoom state
  const xDomain = [zoom.x0, zoom.x1];
  const yDomain = isScore
    ? [zoom.ly0 ?? yUnitBot, zoom.ly1 ?? yUnitTop]
    : [Math.exp(zoom.ly0 ?? yLogBot), Math.exp(zoom.ly1 ?? yLogTop)];

  // Switching y-axis mode drops any zoom (zoom math lives in log-hours space).
  const switchMode = useCallback(mode => {
    setYMode(mode);
    resetZoom();
  }, [resetZoom]);

  const onChartMouseMove = useCallback((e) => {
    if (isPanning.current) return;
    const container = chartRef.current;
    if (!container) return;
    const rect = container.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    let closest = null, bestDist = 18; // 18px hit radius
    for (const dp of dotPositions.current) {
      const dist = Math.hypot(dp.cx - mx, dp.cy - my);
      if (dist < bestDist) { bestDist = dist; closest = dp; }
    }
    if (closest) {
      clearTimeout(fadeTimer.current);
      setTipState({ model: closest.m, cx: closest.cx, cy: closest.cy, opacity: 1 });
    } else if (tipState.opacity === 1) {
      // Mouse moved away from any dot — start fade
      setTipState(prev => ({ ...prev, opacity: 0 }));
      fadeTimer.current = setTimeout(() => {
        setTipState(prev => prev.opacity === 0 ? { ...prev, model: null } : prev);
      }, 1000);
    }
  }, [tipState.opacity]);

  const onChartMouseLeave = useCallback(() => {
    if (tipState.model) {
      setTipState(prev => ({ ...prev, opacity: 0 }));
      fadeTimer.current = setTimeout(() => {
        setTipState(prev => prev.opacity === 0 ? { ...prev, model: null } : prev);
      }, 1000);
    }
  }, [tipState.model]);

  const xTicks = useMemo(() => {
    const t = [];
    // Derived from CS/CE so the ticks can't drift out of sync with the range.
    const y0 = new Date(CS).getFullYear(), y1 = new Date(CE).getFullYear();
    for (let y=y0; y<=y1; y++) { t.push(new Date(y,0,1).getTime()); if(y<y1) t.push(new Date(y,6,1).getTime()); }
    return t;
  }, []);

  const fmtDate = ts => {
    const d=new Date(ts), m=d.getMonth(), y=d.getFullYear();
    return m===0 ? `${y}` : `Jul '${String(y).slice(2)}`;
  };

  const Dots = (props) => {
    const xM=props.xAxisMap, yM=props.yAxisMap;
    if (!xM||!yM) return null;
    const xS=xM[Object.keys(xM)[0]]?.scale, yS=yM[Object.keys(yM)[0]]?.scale;
    if (!xS||!yS) return null;
    // Plot-area pixel bounds (from the scale ranges) — used to clip dots/CIs to the
    // chart the same way allowDataOverflow clips the trend lines when zoomed in.
    const xr=xS.range(), yr=yS.range();
    const px0=Math.min(xr[0],xr[1]), px1=Math.max(xr[0],xr[1]);
    const py0=Math.min(yr[0],yr[1]), py1=Math.max(yr[0],yr[1]);
    // Store pixel positions for mouse proximity detection
    const positions = [];
    if (isScore) {
      // ── Score mode: index points; imputed values are dashed diamonds. ──
      const sels = idxModels.map(m => {
        const cx=xS(m.ts), cy=yS(m.sc);
        const c=COL[m.l], lb=LBL[m.n];
        if (isNaN(cx)||isNaN(cy)) return null;
        if (cx>=px0 && cx<=px1 && cy>=py0 && cy<=py1) positions.push({m, cx, cy});
        const onFrontier = isIdxFrontier(m);
        const hasCI = m.lo != null && m.hi != null && m.hi > m.lo;
        const ct = hasCI ? yS(m.hi) : null, cb = hasCI ? yS(m.lo) : null;
        return (<g key={"idx"+m.n+m.d} className={`mp${lb?' al':''}`}>
          {hasCI && <>
            <line x1={cx} y1={ct} x2={cx} y2={cb} stroke={c} strokeWidth={1.5} opacity={0.45}/>
            <line x1={cx-3} y1={ct} x2={cx+3} y2={ct} stroke={c} strokeWidth={1} opacity={0.45}/>
            <line x1={cx-3} y1={cb} x2={cx+3} y2={cb} stroke={c} strokeWidth={1} opacity={0.45}/>
          </>}
          {m.imp
            ? <path d={`M ${cx} ${cy-6} L ${cx+6} ${cy} L ${cx} ${cy+6} L ${cx-6} ${cy} Z`}
                fill="#12121f" stroke={c} strokeWidth={1.8} strokeDasharray="3 2"/>
            : <circle cx={cx} cy={cy} r={5} fill={onFrontier?c:"#12121f"}
                stroke={onFrontier?undefined:c} strokeWidth={onFrontier?undefined:2}/>}
          <text className="ml" x={cx+(lb?.dx||8)} y={cy+(lb?.dy||-8)} fill={c}
            fontSize={11} fontFamily={FONT} fontWeight={500} textAnchor={lb?.a||"start"}>{m.n}</text>
        </g>);
      });
      dotPositions.current = positions;
      return (<g>
        <defs><clipPath id="plotClip"><rect x={px0} y={py0} width={px1-px0} height={py1-py0}/></clipPath></defs>
        <g clipPath="url(#plotClip)">{sels}</g>
      </g>);
    }
    const vis = models.filter(m => m.ts>=CS && m.ts<=CE);
    const els = vis.map(m => {
      const cx=xS(m.ts), cy=yS(m.p);
      const c=COL[m.l], lb=LBL_TH_HIDE.has(m.n)?undefined:LBL[m.n];
      if (isNaN(cx)||isNaN(cy)) return null;
      // Only register hover targets for dots whose center is inside the plot area.
      if (cx>=px0 && cx<=px1 && cy>=py0 && cy<=py1) positions.push({m, cx, cy});
      const hasCI = m.lo != null && m.hi != null;
      const ct = hasCI ? yS(Math.min(m.hi,yhiDyn)) : null;
      const cb = hasCI ? yS(Math.max(m.lo,YLO)) : null;
      const isOverlay = !isSota(m); // hollow if not SOTA in the active horizon
      return (<g key={m.n+m.d} className={`mp${lb?' al':''}`}>
        {hasCI && <>
          <line x1={cx} y1={ct} x2={cx} y2={cb} stroke={c} strokeWidth={1.5} opacity={0.45}/>
          <line x1={cx-3} y1={ct} x2={cx+3} y2={ct} stroke={c} strokeWidth={1} opacity={0.45}/>
          <line x1={cx-3} y1={cb} x2={cx+3} y2={cb} stroke={c} strokeWidth={1} opacity={0.45}/>
        </>}
        <circle cx={cx} cy={cy} r={5} fill={isOverlay?"#12121f":c}
          stroke={isOverlay?c:undefined} strokeWidth={isOverlay?2:undefined}/>
        <text className="ml" x={cx+(lb?.dx||8)} y={cy+(lb?.dy||-8)} fill={c}
          fontSize={11} fontFamily={FONT} fontWeight={500} textAnchor={lb?.a||"start"}>{m.n}</text>
      </g>);
    });
    // Predicted horizons (AECI conversions): dashed hollow diamonds.
    const pels = testedOnly ? [] : predModels.filter(m => m.ts>=CS && m.ts<=CE).map(m => {
      const cx=xS(m.ts), cy=yS(m.p);
      const c=COL[m.l], lb=LBL_TH_HIDE.has(m.n)?undefined:LBL[m.n];
      if (isNaN(cx)||isNaN(cy)) return null;
      if (cx>=px0 && cx<=px1 && cy>=py0 && cy<=py1) positions.push({m, cx, cy});
      return (<g key={"pred"+m.n} className={`mp${lb?' al':''}`}>
        <path d={`M ${cx} ${cy-6} L ${cx+6} ${cy} L ${cx} ${cy+6} L ${cx-6} ${cy} Z`}
          fill="#12121f" stroke={c} strokeWidth={1.8} strokeDasharray="3 2"/>
        <text className="ml" x={cx+(lb?.dx||8)} y={cy+(lb?.dy||-8)} fill={c} opacity={0.85}
          fontSize={11} fontFamily={FONT} fontWeight={500} fontStyle="italic" textAnchor={lb?.a||"start"}>{m.n}</text>
      </g>);
    });
    dotPositions.current = positions;
    return (<g>
      <defs><clipPath id="plotClip"><rect x={px0} y={py0} width={px1-px0} height={py1-py0}/></clipPath></defs>
      <g clipPath="url(#plotClip)">{els}{pels}</g>
    </g>);
  };

  const CTooltip = ({active, payload}) => {
    if (!active||!payload?.length) return null;
    const ts=payload[0]?.payload?.ts;
    if (!ts) return null;
    const d=new Date(ts);
    const ds=d.toLocaleString("en-US",{month:"short",year:"numeric"});
    return (<div style={{background:"#1a1a2e",border:"1px solid #444",borderRadius:6,padding:"8px 12px",fontFamily:FONT,fontSize:12,color:"#ccc"}}>
      <div style={{fontWeight:700,marginBottom:4}}>{ds}</div>
      {payload.map(p=>{
        const SC = { scSlow: scoreSlowLabel, scFast: scoreFastLabel, scDecel: scoreDecelLabel };
        if (SC[p.dataKey])
          return (<div key={p.dataKey} style={{color:p.stroke}}>
            {SC[p.dataKey]}: <b>{p.value.toFixed(1)}</b>
            {p.dataKey === "scFast" && lastIdx && scoreFit?.fast && ts >= lastIdx.ts &&
              <div>Trend from {lastIdx.n}:{" "}
                <b>{(lastIdx.sc + scoreFit.fast.slope * (ts - lastIdx.ts)).toFixed(1)}</b></div>}
          </div>);
        const dbl=p.payload?.[p.dataKey+"Dbl"];
        const PFX={slow:"Trend",fast:"Trend",decel:"Slowdown"};
        const lbl=dbl!=null ? `${PFX[p.dataKey]||"Trend"}: ${dbl.toFixed(1)}-month doubling` : p.name;
        return (<div key={p.dataKey} style={{color:p.stroke}}>{lbl}: <b>{fmtH(p.value)}</b>
          {p.dataKey === "fast" && lastSota && ts >= lastSota.ts &&
            <div>Trend from {lastSota.n}:{" "}
              <b>{fmtH(lastSota.p * Math.exp(recFit.a * (ts - lastSota.ts)))}</b></div>}
        </div>);
      })}
    </div>);
  };

  const horizonTag = useP80 ? "p80" : "p50";
  const slowLabel = "7-month doubling (all-time trend)";
  const fastLabel = fitFast
    ? `${recFit.dMo.toFixed(1)}-month doubling (fitted ${horizonTag}, 2024+)`
    : "3.5-month doubling (2024+ trend)";
  const decStart = new Date(decayStartMs).toLocaleString("en-US",{month:"short",year:"numeric"});
  // Toggle label tracks the chosen start year (same Date basis as decStart, so
  // the two never disagree about which year a start date falls in).
  const decYear = new Date(decayStartMs).getFullYear();
  const decelLabel = `Slowdown: −${decayPct}%/doubling from ${decStart}`;
  const scoreSlowLabel = scoreFit && scoreFit.slow
    ? `Trend: +${scoreFit.slow.perYr.toFixed(1)} ${yMode.toUpperCase()}/yr (pre-2024, n=${scoreFit.slow.n})`
    : "";
  const scoreFastLabel = scoreFit && scoreFit.fast
    ? (scoreFit.fast.pinned
        ? `Trend: +13.5 ${yMode.toUpperCase()}/yr (system-card rate, n=${scoreFit.fast.n})`
        : `Trend: +${scoreFit.fast.perYr.toFixed(1)} ${yMode.toUpperCase()}/yr (2024+, n=${scoreFit.fast.n})`)
    : "";
  const scoreDecelLabel = scoreDecel ? `Slowdown: −${decayPct}%/doubling-equiv from ${decStart}` : "";

  return (
    <div style={{background:"#12121f",minHeight:"100vh",padding:isMobile?"16px 6px":"32px 24px"}}>
      <div style={{maxWidth:SHELL_W,margin:"0 auto"}}>
        <h1 style={{fontFamily:FONT_D,fontSize:26,fontWeight:700,color:"#eee",marginBottom:4,letterSpacing:"-0.02em"}}>
          METR Time Horizon Trends
        </h1>
        <p style={{fontSize:13,color:"#777",marginBottom:6,lineHeight:1.5}}>
          Used in <a href="https://www.lesswrong.com/posts/EYb2K9acKfyG2bome/metr-time-horizons-now-10x-year"
            style={{color:"#7eb8da",textDecoration:"none"}} target="_blank" rel="noopener noreferrer"
            onMouseOver={e=>e.target.style.textDecoration="underline"} onMouseOut={e=>e.target.style.textDecoration="none"}
          >METR Time Horizons: Now 10x/Year</a>
        </p>
        <p style={{fontSize:14,color:"#888",marginBottom:20,lineHeight:1.5,maxWidth:PROSE_W}}>
          SOTA model performance (dots with 95% CI) against exponential trend fits.
          Dashed diamonds are predicted horizons for models METR hasn't run, converted
          from ECI/AECI capability indices (see <code style={{fontSize:12}}>analysis/</code>).{" "}
          <span style={{color:COL.openai}}>OpenAI</span>{" / "}
          <span style={{color:COL.anthropic}}>Anthropic</span>{" / "}
          <span style={{color:COL.google}}>Google</span>{" / "}
          <span style={{color:COL.zai}}>Z.ai</span>{" / "}
          <span style={{color:COL.deepseek}}>Open-weights (DeepSeek, Moonshot)</span>
        </p>

        {/* Y-axis mode: measured time horizon vs capability-index scores */}
        <div style={{display:"flex",gap:0,marginBottom:10,fontFamily:FONT_D,fontSize:12}}>
          {[["th","Time horizon"],["eci","ECI"],["aeci","AECI"]].map(([mode,lb],i)=>(
            <button key={mode} onClick={()=>switchMode(mode)} style={{
              background:yMode===mode?"#2a2a40":"transparent",color:yMode===mode?"#eee":"#777",
              border:"1px solid #444",borderLeft:i===0?"1px solid #444":"none",
              borderRadius:i===0?"6px 0 0 6px":(i===2?"0 6px 6px 0":0),
              padding:"5px 14px",cursor:"pointer",fontFamily:FONT_D,fontSize:12}}>{lb}</button>
          ))}
        </div>
        <div ref={chartRef} style={{position:"relative",cursor:isZoomed?"grab":"default"}} onMouseDown={onPanStart} onMouseMove={onChartMouseMove} onMouseLeave={onChartMouseLeave}>
        {lastTip.current && (()=>{
          const {model:m,cx,cy}=lastTip.current;
          const d=new Date(m.d);
          const ds=d.toLocaleString("en-US",{month:"short",day:"numeric",year:"numeric"});
          const containerW = chartRef.current ? chartRef.current.getBoundingClientRect().width : 900;
          const flipX=cx>containerW*0.6;
          return (<div style={{position:"absolute",left:flipX?Math.max(4,cx-180):cx+20,top:Math.max(10,cy-40),
            background:"#1a1a2e",border:"1px solid "+COL[m.l],borderRadius:6,padding:"10px 14px",
            fontFamily:FONT,fontSize:13,color:"#ccc",lineHeight:1.7,pointerEvents:"none",zIndex:10,
            minWidth:160,opacity:tipState.opacity,transition:"opacity 1s"}}>
            <div style={{fontWeight:700,color:COL[m.l],marginBottom:2}}>{m.n}</div>
            <div>{ds}</div>
            {(()=>{ // unified body: TH, ECI, AECI for every model, provenance tagged
              const r0 = INFO[m.n];
              if (!r0) return null;
              // predicted horizons follow the selected conversion basis
              const r = m.pred ? { ...r0, p50: m.pm50, p80: m.pm80 } : r0;
              const tag = s => s === "measured" ? "" : ` (${s})`;
              const hl = (key, txt) => key === hlKey
                ? <b style={{color:"#eee"}}>{txt}</b> : <>{txt}</>;
              const hlKey = m.idx ? yMode : (useP80 ? "p80" : "p50");
              return (<>
                {r.p50 != null && (() => {
                  // Lead with the horizon the p50/p80 toggle is on, spelled out
                  // with its hours; the other one trails in natural units only.
                  const lead = useP80 ? "p80" : "p50", trail = useP80 ? "p50" : "p80";
                  const val = k => (k === "p50" ? r.p50 : r.p80) / 60;
                  return (<div>TH {lead}: {hl(lead, fmtHLong(val(lead)))}
                    {r[trail] != null && <> · {trail}: {hl(trail, fmtH(val(trail)))}</>}
                    <span style={{color:"#999"}}>{tag(r.thSrc)}</span></div>);
                })()}
                {r.eci != null && <div style={{color:"#9ab7d3"}}>ECI: {hl("eci", r.eci)}
                  <span style={{color:"#999"}}>{tag(r.eciSrc)}</span></div>}
                {r.aeci != null && <div style={{color:"#9ab7d3"}}>AECI: {hl("aeci", r.aeci)}
                  <span style={{color:"#999"}}>{tag(r.aeciSrc)}</span></div>}
              </>);
            })()}
            {m.pred && !m.idx && basisNote(m) &&
              <div style={{fontSize:11,color:"#8fa8c8",marginTop:3}}>via {basisNote(m)}</div>}
            {!m.idx && m.lo != null && m.hi != null &&
              <div style={{fontSize:11,color:"#777",marginTop:2}}>95% CI ({useP80?"p80":"p50"}): {fmtH(m.lo)} – {fmtH(m.hi)}</div>}
            {m.idx && yMode === "aeci" && m.lo != null &&
              <div style={{fontSize:11,color:"#777",marginTop:2}}>95% CI: {m.lo} – {m.hi}</div>}
            {!m.idx && !m.pred && !isSota(m) &&
              <div style={{fontSize:11,color:"#f0c050",marginTop:4}}>Not {useP80?"p80":"p50"}-frontier — excluded from fit</div>}
            {m.idx && !isIdxFrontier(m) &&
              <div style={{fontSize:11,color:"#f0c050",marginTop:4}}>
                {m.est ? "Estimated — excluded from trend fit"
                  : m.imp ? "Imputed — excluded from trend fit"
                  : "Off-frontier — excluded from trend fit"}</div>}
          </div>);
        })()}
        <ResponsiveContainer width="100%" height={CHART_HEIGHT}>
          <ComposedChart data={isScore ? scoreTrendData : trendData} margin={CHART_MARGIN}>
            <CartesianGrid stroke="#2a2a40" strokeDasharray="3 3"/>
            <XAxis dataKey="ts" type="number" domain={xDomain} ticks={xTicks.filter(t=>t>=zoom.x0&&t<=zoom.x1)} tickFormatter={fmtDate}
              stroke="#666" tick={{fontSize:isMobile?10:12,fontFamily:FONT,fill:"#999"}} axisLine={{stroke:"#444"}} allowDataOverflow/>
            {isScore
              ? <YAxis scale="linear" domain={yDomain} allowDataOverflow ticks={scoreTicks.filter(t=>t>=yDomain[0]&&t<=yDomain[1])}
                  stroke="#666" tick={{fontSize:isMobile?9:11,fontFamily:FONT,fill:"#999"}} axisLine={{stroke:"#444"}} width={YAXIS_W}/>
              : <YAxis scale="log" domain={yDomain} allowDataOverflow ticks={YTICKS.filter(t=>t>=yDomain[0]&&t<=yDomain[1])} tickFormatter={fmtYTick}
                  stroke="#666" tick={{fontSize:isMobile?9:11,fontFamily:FONT,fill:"#999"}} axisLine={{stroke:"#444"}} width={YAXIS_W}/>}
            {!isScore && MS.map(m=>(<ReferenceLine key={m.lb} y={m.h} stroke="#333" strokeDasharray="2 4"
              label={isMobile?false:{value:m.lb,position:"right",fill:"#555",fontSize:10,fontFamily:FONT}}/>))}
            <ReferenceLine x={TODAY} stroke="#f0c050" strokeDasharray="4 4" strokeWidth={1}
              label={{value:"Today",position:"top",fill:"#f0c050",fontSize:11,fontFamily:FONT_D}}/>
            {!isScore && <Line dataKey="slow" stroke={COL.slow} strokeWidth={2} strokeDasharray="8 4"
              dot={false} name={slowLabel} isAnimationActive={false}/>}
            {!isScore && <Line dataKey="fast" stroke={COL.fast} strokeWidth={2} strokeDasharray="8 4"
              dot={false} name={fastLabel} isAnimationActive={false}/>}
            {!isScore && <Line dataKey="decel" stroke={COL.decel} strokeWidth={2} strokeDasharray="8 4"
              dot={false} name={decelLabel} isAnimationActive={false}/>}
            {isScore && <Line dataKey="scSlow" stroke={COL.slow} strokeWidth={2} strokeDasharray="8 4"
              dot={false} name={scoreSlowLabel} isAnimationActive={false}/>}
            {isScore && <Line dataKey="scFast" stroke={COL.fast} strokeWidth={2} strokeDasharray="8 4"
              dot={false} name={scoreFastLabel} isAnimationActive={false}/>}
            {isScore && <Line dataKey="scDecel" stroke={COL.decel} strokeWidth={2} strokeDasharray="8 4"
              dot={false} name={scoreDecelLabel} isAnimationActive={false}/>}
            <Customized component={Dots}/>
            {!tipState.model && <Tooltip content={<CTooltip/>}/>}
          </ComposedChart>
        </ResponsiveContainer>
        {isZoomed && <button onClick={resetZoom} style={{position:"absolute",top:isMobile?8:28,right:isMobile?20:96,
          background:"#2a2a40",color:"#ccc",border:"1px solid #555",borderRadius:4,padding:"4px 10px",
          fontSize:11,fontFamily:FONT_D,cursor:"pointer",zIndex:5}}>Reset zoom</button>}
        </div>

        {/* Custom legend */}
        <div style={{display:"flex",flexWrap:"wrap",gap:16,marginTop:12,fontSize:13,color:"#999"}}>
          {isScore && <>
            {[[COL.slow,scoreSlowLabel],[COL.fast,scoreFastLabel],[COL.decel,scoreDecelLabel]].filter(([,lb])=>lb).map(([c,lb])=>(
              <div key={lb} style={{display:"flex",alignItems:"center",gap:6}}>
                <svg width={24} height={3}><line x1={0} y1={1.5} x2={24} y2={1.5} stroke={c} strokeWidth={2} strokeDasharray="6 3"/></svg>
                {lb}
              </div>
            ))}
            <div style={{display:"flex",alignItems:"center",gap:6,cursor:"pointer",userSelect:"none"}}
              onClick={()=>setExtendSlow(v=>!v)}>
              <span style={{display:"inline-block",width:14,height:14,borderRadius:3,border:"1.5px solid "+COL.slow,
                background:extendSlow?COL.slow:"transparent",transition:"background 0.15s"}}/>
              <span style={{color:extendSlow?"#ccc":"#777",transition:"color 0.15s"}}>Extend pre-2024 trend →</span>
            </div>
            <div style={{display:"flex",alignItems:"center",gap:6,cursor:"pointer",userSelect:"none"}}
              onClick={()=>setShowFast(v=>!v)}>
              <span style={{display:"inline-block",width:14,height:14,borderRadius:3,border:"1.5px solid "+COL.fast,
                background:showFast?COL.fast:"transparent",transition:"background 0.15s"}}/>
              <span style={{color:showFast?"#ccc":"#777",transition:"color 0.15s"}}>No slowdown</span>
            </div>
            <div style={{display:"flex",alignItems:"center",gap:6,cursor:"pointer",userSelect:"none"}}
              onClick={()=>setShowDecel(v=>!v)}>
              <span style={{display:"inline-block",width:14,height:14,borderRadius:3,border:"1.5px solid "+COL.decel,
                background:showDecel?COL.decel:"transparent",transition:"background 0.15s"}}/>
              <span style={{color:showDecel?"#ccc":"#777",transition:"color 0.15s"}}>{decYear} slowdown</span>
            </div>
            <div style={{display:"flex",alignItems:"center",gap:6,cursor:"pointer",userSelect:"none"}}
              onClick={()=>setPinScore(v=>!v)}>
              <span style={{display:"inline-block",width:14,height:14,borderRadius:3,border:"1.5px solid "+COL.fast,
                background:pinScore?COL.fast:"transparent",transition:"background 0.15s"}}/>
              <span style={{color:pinScore?"#ccc":"#777",transition:"color 0.15s"}}>Pin trend to 13.5/yr (system card)</span>
            </div>
            <div style={{display:"flex",alignItems:"center",gap:6}}>
              <svg width={14} height={14}><path d="M 7 1.5 L 12.5 7 L 7 12.5 L 1.5 7 Z" fill="#12121f"
                stroke="#999" strokeWidth={1.5} strokeDasharray="3 2"/></svg>
              imputed (via ECI↔AECI fit) or estimated (from TH)
            </div>
            <div style={{display:"flex",alignItems:"center",gap:6}}>
              <svg width={12} height={12}><circle cx={6} cy={6} r={4.5} fill="#12121f" stroke="#999" strokeWidth={2}/></svg>
              off-frontier (excluded from trend)
            </div>
          </>}
          {!isScore && [[COL.slow,slowLabel],[COL.fast,fastLabel],[COL.decel,decelLabel]].map(([c,lb])=>(
            <div key={lb} style={{display:"flex",alignItems:"center",gap:6}}>
              <svg width={24} height={3}><line x1={0} y1={1.5} x2={24} y2={1.5} stroke={c} strokeWidth={2} strokeDasharray="6 3"/></svg>
              {lb}
            </div>
          ))}
          {!isScore && <><div style={{display:"flex",alignItems:"center",gap:6,cursor:"pointer",userSelect:"none"}}
            onClick={()=>setExtendSlow(v=>!v)}>
            <span style={{display:"inline-block",width:14,height:14,borderRadius:3,border:"1.5px solid "+COL.slow,
              background:extendSlow?COL.slow:"transparent",transition:"background 0.15s"}}/>
            <span style={{color:extendSlow?"#ccc":"#777",transition:"color 0.15s"}}>Extend 7-mo trend →</span>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:6,cursor:"pointer",userSelect:"none"}}
            onClick={()=>setShowFast(v=>!v)}>
            <span style={{display:"inline-block",width:14,height:14,borderRadius:3,border:"1.5px solid "+COL.fast,
              background:showFast?COL.fast:"transparent",transition:"background 0.15s"}}/>
            <span style={{color:showFast?"#ccc":"#777",transition:"color 0.15s"}}>No slowdown</span>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:6,cursor:"pointer",userSelect:"none"}}
            onClick={()=>setShowDecel(v=>!v)}>
            <span style={{display:"inline-block",width:14,height:14,borderRadius:3,border:"1.5px solid "+COL.decel,
              background:showDecel?COL.decel:"transparent",transition:"background 0.15s"}}/>
            <span style={{color:showDecel?"#ccc":"#777",transition:"color 0.15s"}}>{decYear} slowdown</span>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:6,cursor:"pointer",userSelect:"none"}}
            onClick={()=>setUseP80(v=>!v)}>
            <span style={{display:"inline-block",width:14,height:14,borderRadius:3,border:"1.5px solid #f0c050",
              background:useP80?"#f0c050":"transparent",transition:"background 0.15s"}}/>
            <span style={{color:useP80?"#ccc":"#777",transition:"color 0.15s"}}>Show p80 (harder tasks)</span>
          </div>
          {!testedOnly && <div style={{display:"flex",alignItems:"center",gap:4,position:"relative"}}>
            <span style={{display:"flex",alignItems:"center",gap:6,marginRight:2}}>
              <svg width={14} height={14}><path d="M 7 1.5 L 12.5 7 L 7 12.5 L 1.5 7 Z" fill="#12121f"
                stroke={COL.anthropic} strokeWidth={1.5} strokeDasharray="3 2"/></svg>
              <span style={{color:"#999"}}>predicted, via fit:</span>
            </span>
            {[["default","per-lab default"],["aeci","AECI"],["eci","ECI pooled"],["lab","ECI lab-adj"]].map(([v,lb])=>(
              <button key={v} onClick={()=>setPredBasis(v)}
                onMouseEnter={()=>setBasisTip(v)} onMouseLeave={()=>setBasisTip(null)}
                onFocus={()=>setBasisTip(v)} onBlur={()=>setBasisTip(null)} style={{
                background:predBasis===v?"#2a2a40":"transparent",color:predBasis===v?"#eee":"#777",
                border:"1px solid #444",borderRadius:4,padding:"2px 8px",cursor:"pointer",
                fontFamily:FONT,fontSize:12}}>{lb}</button>
            ))}
            {/* One popover for the whole group, anchored to the group's left edge
                so it can't run off-screen behind the right-most button. */}
            {basisTip && <div style={{position:"absolute",bottom:"calc(100% + 8px)",left:0,zIndex:30,
              width:"min(440px, 88vw)",background:"#1a1a2e",border:"1px solid #444",borderRadius:6,
              padding:"10px 13px",boxShadow:"0 4px 14px rgba(0,0,0,0.5)",pointerEvents:"none"}}>
              <div style={{fontFamily:FONT_D,fontSize:12,fontWeight:700,color:"#eee",marginBottom:5}}>
                {BASIS_DOC[basisTip][0]}</div>
              <div style={{fontSize:12,lineHeight:1.55,color:"#bbb"}}>{BASIS_DOC[basisTip][1]}</div>
            </div>}
          </div>}
          <div style={{display:"flex",alignItems:"center",gap:6,cursor:"pointer",userSelect:"none"}}
            onClick={()=>setFitFast(v=>!v)}>
            <span style={{display:"inline-block",width:14,height:14,borderRadius:3,border:"1.5px solid "+COL.fast,
              background:fitFast?COL.fast:"transparent",transition:"background 0.15s"}}/>
            <span style={{color:fitFast?"#ccc":"#777",transition:"color 0.15s"}}>Fit fast slope to data</span>
          </div></>}
          <div style={{display:"flex",alignItems:"center",gap:6,cursor:"pointer",userSelect:"none"}}
            onClick={()=>setTestedOnly(v=>!v)}>
            <span style={{display:"inline-block",width:14,height:14,borderRadius:3,border:"1.5px solid #9ab7d3",
              background:testedOnly?"#9ab7d3":"transparent",transition:"background 0.15s"}}/>
            <span style={{color:testedOnly?"#ccc":"#777",transition:"color 0.15s"}}>Show tested models only</span>
          </div>
          {[["OpenAI",COL.openai],["Anthropic",COL.anthropic],["Google",COL.google],["Z.ai",COL.zai],["Open-weights",COL.deepseek]].map(([lb,c])=>(
            <div key={lb} style={{display:"flex",alignItems:"center",gap:5}}>
              <svg width={10} height={10}><circle cx={5} cy={5} r={4} fill={c}/></svg>{lb}
            </div>
          ))}
        </div>

        {/* Slowdown-scenario parameters (shared by TH and score modes) */}
        {<div style={{display:"flex",flexWrap:"wrap",alignItems:"center",gap:14,marginTop:10,fontSize:13,
          color:showDecel?"#999":"#555",transition:"color 0.15s"}}>
          <span style={{display:"flex",alignItems:"center",gap:6}}>
            <svg width={24} height={3}><line x1={0} y1={1.5} x2={24} y2={1.5} stroke={COL.decel} strokeWidth={2} strokeDasharray="6 3"/></svg>
            Slowdown:
          </span>
          <label style={{display:"flex",alignItems:"center",gap:6}}>
            decay
            <input type="number" value={decayPct} min={0} max={95} step={5} disabled={!showDecel}
              onChange={e=>setDecayPct(Math.min(95,Math.max(0,Number(e.target.value)||0)))}
              style={{width:56,background:"#1a1a2e",color:"#ccc",border:"1px solid #444",borderRadius:4,
                padding:"3px 6px",fontFamily:FONT,fontSize:13}}/>
            % per horizon doubling
          </label>
          <label style={{display:"flex",alignItems:"center",gap:6}}>
            starting
            <input type="date" value={decayStartStr} disabled={!showDecel}
              onChange={e=>setDecayStartStr(e.target.value)}
              style={{background:"#1a1a2e",color:"#ccc",border:"1px solid #444",borderRadius:4,
                padding:"3px 6px",fontFamily:FONT,fontSize:13,colorScheme:"dark"}}/>
          </label>
        </div>}

        {isScore
          ? <p style={{fontSize:12,color:"#666",marginTop:12,lineHeight:1.5,maxWidth:PROSE_W}}>
              Linear Y-axis: {yMode==="eci" ? "Epoch Capabilities Index (public ECI)" :
              "Anthropic internal ECI (AECI, extracted from system-card charts)"}. Filled dots are
              measured scores; dashed diamonds are imputed through the fitted ECI↔AECI line
              (AECI = {FITS.eciAeci.a.toFixed(2)} + {FITS.eciAeci.b.toFixed(3)}·ECI, within-variant
              Claude pairs). Trends are linear fits to the running-max frontier over measured
              scores only — imputed and estimated points are plotted but never set the frontier —
              split at the same mid-2024 break as the time-horizon view. Data: Epoch AI Benchmarking Hub / abstatisticalconsulting.substack.com.
            </p>
          : <p style={{fontSize:12,color:"#666",marginTop:12,lineHeight:1.5,maxWidth:PROSE_W}}>
          Log-scale Y-axis (hours of human-expert work). 7-month trend anchored to pre-mid-2024 SOTA;
          {fitFast
            ? ` fast trend is a least-squares fit to mid-2024+ ${horizonTag} points (${recFit.dMo.toFixed(1)}-mo doubling).`
            : " fast trend fixed at 3.5-month doubling, anchored to mid-2024+ reasoning-era SOTA."}
          {" "}Data: METR Horizon v1.1.
        </p>}

        <div style={{marginTop:28,padding:"18px 22px",background:"#1a1a2e",borderRadius:8,borderLeft:"3px solid #f0c050",maxWidth:PROSE_W}}>
          <h3 style={{fontFamily:FONT_D,fontSize:15,fontWeight:700,color:"#eee",marginBottom:8}}>
            Progress has accelerated with reasoning models
          </h3>
          <p style={{fontSize:14,lineHeight:1.7,color:"#bbb",margin:0}}>
            Since mid-2024, reasoning models have driven a sharp acceleration in autonomous
            task horizons, repeatedly setting new state-of-the-art marks. The latest frontier
            model handles tasks that take human experts about {fmtH(M[M.length-1].p)}. If that
            pace continues, we should see{" "}
            <span style={{color:"#f0c050"}}>1–2-week task horizons</span> in 2026 and{" "}
            <span style={{color:"#f0c050"}}>multi-month horizons</span> by the end of 2027.
          </p>
        </div>

        <FinanceChart isMobile={isMobile} vpH={vp.h}/>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
